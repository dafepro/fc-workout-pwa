services:
  api:
    build:
      context: .
      args:
        GO_BUILD_TAGS: e2e
    environment:
      ALLOWED_ORIGIN: http://[::1]:3000
      APP_ENV: e2e
      DATABASE_URL: file:/data/stridecrew-e2e.db
      ENABLE_E2E_FIXTURES: "true"
      E2E_RESET_KEY: local-e2e-reset-only
      TEAM_TIME_ZONE: America/Chicago
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 1s
      timeout: 2s
      retries: 20
    volumes:
      - e2e-data:/data

  pwa:
    build:
      context: ..
      dockerfile: Dockerfile.e2e
      target: pwa
    depends_on:
      api:
        condition: service_healthy
    environment:
      ZOOMIGO_API_BASE_URL: http://api:8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://[::1]:3000/team').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  e2e:
    build:
      context: .
      target: test
      args:
        GO_BUILD_TAGS: e2e
    command: ["go", "test", "-tags=e2e", "-count=1", "-v", "./e2e"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://api:8080
      E2E_API_BINARY: /out/stridecrew-api
      E2E_BACKUP_BINARY: /out/stridecrew-backup
      E2E_DATABASE_URL: file:/data/stridecrew-e2e.db
      E2E_RESET_KEY: local-e2e-reset-only
    volumes:
      - e2e-data:/data

  browser-e2e:
    build:
      context: ..
      dockerfile: Dockerfile.e2e
      target: browser-e2e
    depends_on:
      api:
        condition: service_healthy
      pwa:
        condition: service_healthy
    network_mode: service:pwa
    environment:
      E2E_API_BASE_URL: http://api:8080
      E2E_PWA_BASE_URL: http://[::1]:3000
      E2E_RESET_KEY: local-e2e-reset-only

volumes:
  e2e-data:
