version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
      next-compatibility:
        patterns:
          - next
          - eslint-config-next
      cloudflare-runtime:
        patterns:
          - "@cloudflare/*"
          - wrangler
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
