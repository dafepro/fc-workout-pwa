name: ZoomiGo toolchain
description: Pinned Node, package-declared pnpm and optional Go/OpenTofu
inputs:
  root:
    description: Application checkout directory
    default: "."
  go:
    description: Install the backend Go toolchain
    default: "false"
  tofu:
    description: Install OpenTofu
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: ${{ inputs.root }}/package.json
        dest: ${{ runner.temp }}/pnpm
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22.20.0
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.root }}/pnpm-lock.yaml
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      if: inputs.go == 'true'
      with:
        go-version-file: ${{ inputs.root }}/backend/go.mod
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: ${{ inputs.root }}/backend/go.sum
    - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      if: inputs.tofu == 'true'
      with:
        tofu_version: 1.10.10
