name: Seal existing deployment credentials for fixed GitHub destinations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seal-deploy-credentials
  cancel-in-progress: false
jobs:
  seal:
    if: github.repository == 'dafepro/fc-workout-pwa' && github.actor_id == '313492551' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            environment: production
          - profile: development
            environment: dev
          - profile: request
            environment: dev
    environment: ${{ matrix.environment }}
    env:
      TRANSFER_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned standard sealing tools without credential inputs
        run: |
          python3 -m venv "$RUNNER_TEMP/seal-venv"
          "$RUNNER_TEMP/seal-venv/bin/pip" install --only-binary=:all: PyNaCl==1.6.2 cffi==2.0.0 pycparser==2.23
      - name: Verify destination isolation with generated fixture keys
        run: '"$RUNNER_TEMP/seal-venv/bin/python" -m unittest discover -s .github/scripts -p test_seal_deploy_credentials.py -v'
      - name: Seal only named production inputs
        if: matrix.profile == 'production'
        env:
          SOURCE_ALERT_EMAIL_ADDRESSES: ${{ secrets.ALERT_EMAIL_ADDRESSES }}
          SOURCE_ANALYTICS_SUBJECT_KEY: ${{ secrets.ANALYTICS_SUBJECT_KEY }}
          SOURCE_BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          SOURCE_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          SOURCE_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          SOURCE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          SOURCE_GRAFANA_PRODUCTION_LOGS_TOKEN: ${{ secrets.GRAFANA_PRODUCTION_LOGS_TOKEN }}
          SOURCE_GRAFANA_PRODUCTION_METRICS_TOKEN: ${{ secrets.GRAFANA_PRODUCTION_METRICS_TOKEN }}
          SOURCE_GRAFANA_READ_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
          SOURCE_STAFF_SECRET_KEY: ${{ secrets.STAFF_SECRET_KEY }}
          SOURCE_TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
          SOURCE_TF_STATE_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          SOURCE_TF_STATE_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          SOURCE_ZOOMIGO_DEPLOY_SSH_KEY: ${{ secrets.ZOOMIGO_DEPLOY_SSH_KEY }}
        run: '"$RUNNER_TEMP/seal-venv/bin/python" .github/scripts/seal_deploy_credentials.py'
      - name: Seal only named development inputs
        if: matrix.profile == 'development'
        env:
          SOURCE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          SOURCE_DEV_ACCESS_SESSION_KEY: ${{ secrets.DEV_ACCESS_SESSION_KEY }}
          SOURCE_DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
          SOURCE_DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          SOURCE_DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          SOURCE_DEV_FIXTURE_SEED: ${{ secrets.DEV_FIXTURE_SEED }}
          SOURCE_DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
          SOURCE_DEV_STAFF_SECRET_KEY: ${{ secrets.DEV_STAFF_SECRET_KEY }}
          SOURCE_DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          SOURCE_GRAFANA_DEV_LOGS_TOKEN: ${{ secrets.GRAFANA_DEV_LOGS_TOKEN }}
          SOURCE_GRAFANA_DEV_METRICS_TOKEN: ${{ secrets.GRAFANA_DEV_METRICS_TOKEN }}
          SOURCE_TF_STATE_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          SOURCE_TF_STATE_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
        run: '"$RUNNER_TEMP/seal-venv/bin/python" .github/scripts/seal_deploy_credentials.py'
      - name: Seal only named request inputs
        if: matrix.profile == 'request'
        env:
          SOURCE_DEPLOY_REQUEST_TOKEN: ${{ secrets.DEPLOY_REQUEST_TOKEN }}
        run: '"$RUNNER_TEMP/seal-venv/bin/python" .github/scripts/seal_deploy_credentials.py'
      - name: Preserve ciphertext only for the fixed GitHub repository keys
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-deploy-credentials-${{ matrix.profile }}
          path: ${{ runner.temp }}/sealed-deploy-credentials/${{ matrix.profile }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary sealing files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/sealed-deploy-credentials" "$RUNNER_TEMP/seal-venv"
