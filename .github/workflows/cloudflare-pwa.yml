name: Cloudflare PWA

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pwa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy production PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZOOMIGO_API_BASE_URL: ${{ vars.ZOOMIGO_API_BASE_URL }}
      STRIDECREW_API_BASE_URL: ${{ vars.STRIDECREW_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Require production configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          zoomigo_base="${ZOOMIGO_API_BASE_URL%/}"
          legacy_base="${STRIDECREW_API_BASE_URL%/}"
          if [ -n "$zoomigo_base" ] && [ -n "$legacy_base" ] && [ "$zoomigo_base" != "$legacy_base" ]; then
            echo "ZOOMIGO_API_BASE_URL conflicts with legacy STRIDECREW_API_BASE_URL" >&2
            exit 1
          fi
          deploy_base="${zoomigo_base:-$legacy_base}"
          case "$deploy_base" in
            https://*) ;;
            *) echo "ZOOMIGO_API_BASE_URL must be an HTTPS origin" >&2; exit 1 ;;
          esac
          echo "DEPLOY_API_BASE_URL=$deploy_base" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks and production build
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Deploy Worker and static assets
        run: >-
          pnpm exec wrangler deploy
          --config dist/server/wrangler.json
          --name zoomigo-training
          --var "ZOOMIGO_API_BASE_URL:$DEPLOY_API_BASE_URL"
