name: Verify and release ZoomiGo

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the periodic Docker E2E and VM smoke suites
        required: false
        type: boolean
        default: false
      deploy:
        description: Release to production (VM + Cloudflare Worker). Leave unchecked to only verify and publish.
        required: false
        type: boolean
        default: false

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Static checks, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.10

      - name: Static checks, unit tests, builds, and contracts
        run: ./scripts/verify.sh

      - name: Docker end-to-end suites
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        run: |
          ./scripts/e2e.sh
          ./scripts/vm-smoke.sh

  publish:
    name: Publish immutable GHCR image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:main
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # Releases are manual. Pushing to main verifies and publishes an image but
  # never deploys; shipping requires explicitly dispatching this workflow with
  # deploy: true. PRODUCTION_DEPLOY_ENABLED is therefore a kill switch rather
  # than an auto-deploy enabler -- set it to anything but "true" to block every
  # release without editing this workflow.
  deploy:
    name: Deploy VM and Cloudflare Worker
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.deploy
      && github.ref == 'refs/heads/main'
      && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Release the verified revision
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          ZOOMIGO_API_BASE_URL: ${{ vars.ZOOMIGO_API_BASE_URL }}
          ZOOMIGO_DEPLOY_SSH_KEY: ${{ secrets.ZOOMIGO_DEPLOY_SSH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: ./deploy/release/release.sh "${{ github.sha }}"
