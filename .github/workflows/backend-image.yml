name: Verify and publish ZoomiGo

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the periodic Docker E2E and VM smoke suites
        required: false
        type: boolean
        default: false

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Static checks, tests, and build
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "macOS", "ARM64", "dcarrell-mac"]') }}
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
      worker-artifact: ${{ steps.worker.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Determine whether publication is needed
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          publish=true
          if [ "${{ github.event_name }}" = push ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin "$BEFORE_SHA"
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" >"$RUNNER_TEMP/changed-paths"
            if ! grep -Eqv '^(docs/|infra/|\.github/|deploy/release/|deploy/secrets/README\.md$|AGENTS\.md$|scripts/(artifact-provenance|infra-plan-encryption|drill-result|runner-job-guard|install-mac-runner|observability-query|observability-host-diagnostic|lounge-placement-holds-monitor|deploy-dev|dev-deploy-smoke|retry-command|pin-host-key-branch)[./-])' "$RUNNER_TEMP/changed-paths"; then
              publish=false
            fi
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        with:
          go: "true"
          tofu: "true"

      - name: Validate workflow syntax
        run: |
          GOBIN="$RUNNER_TEMP/workflow-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/workflow-tools/actionlint" -shellcheck= -pyflakes=

      - name: Static checks, unit tests, builds, and contracts
        if: github.event_name != 'workflow_dispatch' || !inputs.run_e2e
        run: ./scripts/verify.sh

      - name: Intentional full verification
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        run: ./scripts/verify.sh --all

      - name: Package the verified production Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.changes.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/production-worker"
          tar -czf "$RUNNER_TEMP/production-worker/worker.tgz" dist drizzle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.changes.outputs.publish == 'true'
        with:
          name: production-worker-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-worker/worker.tgz
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish immutable GHCR image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.worker-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/production-release

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:main
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=production-api
          cache-to: type=gha,mode=max,scope=production-api
          provenance: mode=max
          sbom: true

      - name: Record matched immutable production artifacts
        env:
          API_DIGEST: ${{ steps.image.outputs.digest }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: node scripts/artifact-provenance.mjs create production "$GITHUB_SHA" "$RUNNER_TEMP/production-release/worker.tgz" "$RUNNER_TEMP/production-release/release-manifest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-release
          retention-days: 30
          if-no-files-found: error
