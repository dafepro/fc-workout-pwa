name: Verify and release ZoomiGo

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Static checks, build, then Docker E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend static checks and unit tests
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Backend static checks and unit tests
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Deployment and release contracts
        shell: pwsh
        run: |
          ./scripts/deployment-contract.ps1
          ./scripts/zoomigo-branding-contract.ps1
          ./scripts/secrets-contract.ps1
          ./scripts/release-contract.ps1
          ./scripts/iac-contract.ps1
          ./scripts/production-automation-contract.ps1

      - name: OpenTofu format and validation
        working-directory: infra/digitalocean
        run: |
          tofu fmt -check
          tofu init -backend=false
          tofu validate

      - name: Docker end-to-end suites
        shell: pwsh
        run: |
          ./scripts/e2e.ps1
          ./scripts/vm-smoke.ps1

  publish:
    name: Publish immutable GHCR image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:main
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy VM and Cloudflare Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Release the verified revision
        env:
          DEPLOY_AGE_IDENTITY: ${{ secrets.ZOOMIGO_DEPLOY_AGE_IDENTITY }}
        run: |
          test -n "$DEPLOY_AGE_IDENTITY"
          identity="$RUNNER_TEMP/zoomigo-deploy-age-identity"
          trap 'rm -f -- "$identity"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_AGE_IDENTITY" > "$identity"
          ./deploy/release/release.sh "$identity" "${{ github.sha }}"
