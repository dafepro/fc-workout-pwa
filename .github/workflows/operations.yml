name: Read-only operations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read a reviewed telemetry query or fixed production host diagnostics
        required: true
        default: query
        type: choice
        options: [query, host-diagnostic]
      environment:
        description: Telemetry environment (query mode only)
        required: true
        default: dev
        type: choice
        options: [dev, production]
      window:
        description: Lookback window (query mode only)
        required: true
        default: 1h
        type: choice
        options: [15m, 1h, 6h, 24h]
      query:
        description: Reviewed diagnostic (query mode only)
        required: true
        default: readiness
        type: choice
        options:
          [
            api-errors,
            request-id,
            latency,
            readiness,
            resources,
            canvas,
            backups,
          ]
      request_id:
        description: Required only for request-id (req_ plus 24 lowercase hex characters)
        required: false
        type: string

permissions:
  contents: read

jobs:
  query:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'query'
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0

      - name: Query reviewed telemetry preset
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_WINDOW: ${{ inputs.window }}
          INPUT_QUERY: ${{ inputs.query }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          GRAFANA_LOGS_QUERY_URL: ${{ vars.GRAFANA_LOGS_QUERY_URL }}
          GRAFANA_LOGS_USERNAME: ${{ vars.GRAFANA_LOGS_USERNAME }}
          GRAFANA_METRICS_QUERY_URL: ${{ vars.GRAFANA_METRICS_QUERY_URL }}
          GRAFANA_METRICS_USERNAME: ${{ vars.GRAFANA_METRICS_USERNAME }}
          GRAFANA_READ_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
        run: |
          set -- \
            --environment "$INPUT_ENVIRONMENT" \
            --window "$INPUT_WINDOW" \
            --query "$INPUT_QUERY" \
            --output observability-result.json
          if [ -n "$INPUT_REQUEST_ID" ]; then
            set -- "$@" --request-id "$INPUT_REQUEST_ID"
          fi
          node scripts/observability-query.mjs "$@"
          {
            printf '## Sanitized observability query\n\n'
            printf -- '- Environment: `%s`\n' "$INPUT_ENVIRONMENT"
            printf -- '- Window: `%s`\n' "$INPUT_WINDOW"
            printf -- '- Preset: `%s`\n' "$INPUT_QUERY"
            printf -- '- Rows: `%s`\n' "$(jq '.rows | length' observability-result.json)"
            printf '\nThe artifact contains only reviewed fields and expires after one day.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observability-${{ github.run_id }}
          path: observability-result.json
          retention-days: 1
          if-no-files-found: error

  host-diagnostic:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'host-diagnostic'
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read fixed collector diagnostics
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          ZOOMIGO_DEPLOY_SSH_KEY: ${{ secrets.ZOOMIGO_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/deploy_ssh_key"
          trap 'rm -f -- "$identity"' EXIT
          (umask 077 && printf '%s\n' "$ZOOMIGO_DEPLOY_SSH_KEY" >"$identity")
          ssh -i "$identity" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=infra/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" sh -s -- /opt/app/deploy/vm \
            <scripts/observability-host-diagnostic.sh
