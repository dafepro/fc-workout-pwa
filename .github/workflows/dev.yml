name: Operate disposable ZoomiGo dev

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create, update, reset, or destroy the disposable environment
        required: true
        default: update
        type: choice
        options: [create, update, reset, destroy]
      ref:
        description: Branch, tag, or SHA to deploy (unused by reset and destroy)
        required: true
        default: main
        type: string

concurrency:
  group: zoomigo-disposable-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verify and package the selected application
    if: inputs.operation == 'create' || inputs.operation == 'update'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the deployed revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify the selected revision
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build
          go -C backend test ./...
          go -C backend test -tags=dev ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the dev-tagged API image
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          docker buildx build \
            --file backend/Dockerfile \
            --platform linux/amd64 \
            --build-arg GO_BUILD_TAGS=dev \
            --build-arg "APP_VERSION=$RELEASE_SHA" \
            --tag "ghcr.io/${{ github.repository }}/api:sha-dev-$RELEASE_SHA" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            backend

      - uses: actions/upload-artifact@v4
        with:
          name: dev-worker-${{ steps.revision.outputs.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  operate:
    name: Operate isolated dev infrastructure
    needs: build
    if: >-
      always() &&
      (inputs.operation == 'reset' ||
      inputs.operation == 'destroy' ||
      needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6

      - name: Install trusted deployment tools
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        if: inputs.operation == 'create' || inputs.operation == 'update'
        with:
          name: dev-worker-${{ needs.build.outputs.revision }}
          path: source/dist

      - name: Initialize disposable infrastructure state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
        working-directory: infra/dev
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.DEV_TF_STATE_BUCKET }}" \
            -backend-config="key=infra/dev/terraform.tfstate" \
            -backend-config="endpoint=${{ vars.DEV_TF_STATE_ENDPOINT }}" \
            -backend-config="region=auto" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true"

      - name: Apply disposable infrastructure
        id: infra
        if: inputs.operation == 'create' || inputs.operation == 'update'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_release_sha: ${{ github.sha }}
          DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        working-directory: infra/dev
        run: |
          key_file="$RUNNER_TEMP/dev-deploy-key"
          printf '%s\n' "$DEPLOY_KEY" >"$key_file"
          chmod 0600 "$key_file"
          TF_VAR_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_ssh_public_key
          tofu fmt -check
          tofu validate
          if tofu state list | grep -qx 'digitalocean_droplet.dev'; then
            echo "created=false" >>"$GITHUB_OUTPUT"
          else
            echo "created=true" >>"$GITHUB_OUTPUT"
          fi
          tofu apply -input=false -auto-approve
          tofu output -raw deploy_host >"$RUNNER_TEMP/dev-host"

      - name: Pin the new host key for this run
        if: inputs.operation == 'create' || inputs.operation == 'update'
        run: |
          host=$(cat "$RUNNER_TEMP/dev-host")
          for _ in $(seq 1 30); do
            if ssh-keyscan -T 5 -H "$host" >"$RUNNER_TEMP/dev-known-hosts" 2>/dev/null && [ -s "$RUNNER_TEMP/dev-known-hosts" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "SSH host key never became available" >&2
          exit 1

      - name: Deploy VM and password-gated Worker
        if: inputs.operation == 'create' || inputs.operation == 'update'
        env:
          DEPLOY_HOST_FILE: ${{ runner.temp }}/dev-host
          DEPLOY_USER: zoomigo
          DEV_DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
          DEV_FIXTURE_SEED: ${{ secrets.DEV_FIXTURE_SEED }}
          DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          DEV_ACCESS_SESSION_KEY: ${{ secrets.DEV_ACCESS_SESSION_KEY }}
          STAFF_SECRET_KEY: ${{ secrets.DEV_STAFF_SECRET_KEY }}
          ZOOMIGO_API_BASE_URL: https://api-dev.zoomigo.quicktrack.cc
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          key_file="$RUNNER_TEMP/dev-deploy-key"
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY_VALUE" >"$key_file"
          chmod 0600 "$key_file" "$RUNNER_TEMP/dev-known-hosts"
          DEPLOY_HOST="$(cat "$DEPLOY_HOST_FILE")"
          export DEPLOY_HOST
          export DEV_DEPLOY_SSH_KEY_FILE="$key_file"
          export DEV_KNOWN_HOSTS_FILE="$RUNNER_TEMP/dev-known-hosts"
          ./deploy/release/deploy-dev.sh \
            "${{ github.sha }}" \
            "${{ needs.build.outputs.revision }}" \
            "$GITHUB_WORKSPACE/source"

      - name: Seed a newly created preview
        if: inputs.operation == 'create' || steps.infra.outputs.created == 'true'
        env:
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Zoomigo-Dev-Gateway: $DEV_API_GATEWAY_TOKEN" \
            -H "X-Zoomigo-Dev-Reset: $DEV_RESET_KEY" \
            https://api-dev.zoomigo.quicktrack.cc/__dev/reset

      - name: Reset preview fixtures
        if: inputs.operation == 'reset'
        env:
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Zoomigo-Dev-Gateway: $DEV_API_GATEWAY_TOKEN" \
            -H "X-Zoomigo-Dev-Reset: $DEV_RESET_KEY" \
            https://api-dev.zoomigo.quicktrack.cc/__dev/reset

      - name: Remove Worker
        if: inputs.operation == 'destroy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler delete zoomigo-training-dev --force

      - name: Destroy disposable infrastructure
        if: inputs.operation == 'destroy'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_release_sha: ${{ github.sha }}
          DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        working-directory: infra/dev
        run: |
          key_file="$RUNNER_TEMP/dev-deploy-key"
          printf '%s\n' "$DEPLOY_KEY" >"$key_file"
          chmod 0600 "$key_file"
          TF_VAR_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_ssh_public_key
          tofu destroy -input=false -auto-approve

      - name: Summarize
        if: always()
        run: |
          {
            echo "### ZoomiGo disposable dev"
            echo ""
            echo "- Operation: \`${{ inputs.operation }}\`"
            echo "- Trusted deployment revision: \`${{ github.sha }}\`"
            if [ -n "${{ needs.build.outputs.revision }}" ]; then
              echo "- Application revision: \`${{ needs.build.outputs.revision }}\`"
            fi
            if [ "${{ inputs.operation }}" != "destroy" ]; then
              echo "- PWA: https://dev.zoomigo.quicktrack.cc"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
