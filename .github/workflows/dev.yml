name: Operate disposable ZoomiGo dev

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Create, update, qualify, reset, or destroy the disposable environment
        required: true
        default: update
        type: choice
        options: [create, update, qualify, reset, destroy]
      ref:
        description: Revision to deploy; qualify requires the live full SHA (unused by reset/destroy)
        required: true
        default: main
        type: string

concurrency:
  group: zoomigo-disposable-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Resolve dev operation
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || vars.DEV_AUTO_UPDATE_ENABLED != 'false')
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve automatic or manual operation
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          MANUAL_REF: ${{ inputs.ref }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "operation=update" >>"$GITHUB_OUTPUT"
            echo "ref=$PUSH_SHA" >>"$GITHUB_OUTPUT"
          else
            if [ "$MANUAL_OPERATION" = qualify ]; then
              case "$MANUAL_REF" in *[!0-9a-f]* | "") echo "qualification requires a full lowercase SHA" >&2; exit 1 ;; esac
              [ "${#MANUAL_REF}" -eq 40 ] || { echo "qualification requires a full SHA" >&2; exit 1; }
            fi
            echo "operation=$MANUAL_OPERATION" >>"$GITHUB_OUTPUT"
            echo "ref=$MANUAL_REF" >>"$GITHUB_OUTPUT"
          fi

  build:
    name: Verify and package the selected application
    needs: context
    if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    env:
      ZOOMIGO_BUILD_PROFILE: development
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      artifact-id: ${{ steps.worker.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ needs.context.outputs.ref }}
          persist-credentials: false

      - name: Resolve the deployed revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - uses: ./controller/.github/actions/setup
        with:
          go: "true"
          root: source

      - name: Install the selected revision
        run: pnpm install --frozen-lockfile

      - name: Test the player application
        run: |
          pnpm test
          pnpm test:world

      - name: Type-check and build the development application
        run: |
          pnpm typecheck
          pnpm build

      - name: Enforce the dev Worker delivery budget
        run: pnpm verify:worker-upload

      - name: Test the API in production and development build modes
        run: |
          go -C backend test ./...
          go -C backend test -tags=dev ./...

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the dev-tagged API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source/backend
          file: source/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/api:sha-dev-${{ steps.revision.outputs.sha }}
          build-args: |
            GO_BUILD_TAGS=dev
            APP_VERSION=${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=development-api
          cache-to: type=gha,mode=max,scope=development-api
          provenance: mode=max
          sbom: true

      - name: Publish the Team World relay image
        id: relay
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          file: source/services/team-world/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/api:world-dev-${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=development-relay
          cache-to: type=gha,mode=max,scope=development-relay
          provenance: mode=max
          sbom: true

      - name: Prove the isolated Team World image starts
        env:
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -e TEAM_WORLD_RELAY_KEY=local-container-contract-key-only-123456 \
            -e TEAM_WORLD_ALLOWED_ORIGIN=http://localhost:3005 \
            -e TEAM_WORLD_API_URL=http://127.0.0.1:19080 \
            --entrypoint node \
            "ghcr.io/${{ github.repository }}/api@$RELAY_DIGEST" \
            --input-type=module -e '
              import assert from "node:assert/strict";
              await import("./services/team-world/server.mjs");
              const response = await fetch("http://127.0.0.1:8795/healthz");
              assert.equal(response.status, 200);
              console.log("Isolated Team World image is healthy");
              process.exit(0);
            '

      - name: Package matched immutable development artifacts
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/dev-release"
          tar -czf "$RUNNER_TEMP/dev-release/worker.tgz" dist
          node "$GITHUB_WORKSPACE/controller/scripts/artifact-provenance.mjs" create development "${{ steps.revision.outputs.sha }}" "$RUNNER_TEMP/dev-release/worker.tgz" "$RUNNER_TEMP/dev-release/release-manifest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: worker
        with:
          name: dev-worker-${{ steps.revision.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-release
          if-no-files-found: error
          retention-days: 1

  operate:
    name: Operate isolated dev infrastructure
    needs: [context, build]
    if: >-
      always() &&
      needs.context.result == 'success' &&
      (needs.context.outputs.operation == 'reset' ||
      needs.context.outputs.operation == 'destroy' ||
      needs.build.result == 'success')
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 35
    environment: dev
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tofu: "true"

      - name: Install trusted deployment tools
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: source

      - name: Verify and unpack the selected application artifact
        if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
        run: |
          node scripts/artifact-provenance.mjs verify development "${{ needs.build.outputs.revision }}" source/worker.tgz source/release-manifest.json
          tar -xzf source/worker.tgz -C source

      - name: Initialize disposable infrastructure state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
        working-directory: infra/dev
        run: |
          ../../deploy/release/retry-command.sh 3 10 tofu init -input=false \
            -backend-config="bucket=${{ vars.DEV_TF_STATE_BUCKET }}" \
            -backend-config="key=infra/dev/terraform.tfstate" \
            -backend-config="endpoint=${{ vars.DEV_TF_STATE_ENDPOINT }}" \
            -backend-config="region=auto" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true"

      - name: Apply disposable infrastructure
        id: infra
        if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_release_sha: ${{ github.sha }}
          TF_VAR_operator_ssh_public_key: ${{ vars.DEV_OPERATOR_SSH_PUBLIC_KEY }}
          DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        working-directory: infra/dev
        run: |
          key_file="$RUNNER_TEMP/dev-deploy-key"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$key_file")
          TF_VAR_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_ssh_public_key
          tofu fmt -check
          tofu validate
          if tofu state list | grep -qx 'digitalocean_droplet.dev'; then
            echo "created=false" >>"$GITHUB_OUTPUT"
          else
            echo "created=true" >>"$GITHUB_OUTPUT"
          fi
          ../../deploy/release/retry-command.sh 3 15 tofu apply \
            -input=false -auto-approve -lock-timeout=5m
          tofu output -raw deploy_host >"$RUNNER_TEMP/dev-host"

      - name: Pin the new host key for this run
        if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
        run: |
          host=$(cat "$RUNNER_TEMP/dev-host")
          for _ in $(seq 1 30); do
            if ssh-keyscan -T 5 -H "$host" >"$RUNNER_TEMP/dev-known-hosts" 2>/dev/null && [ -s "$RUNNER_TEMP/dev-known-hosts" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "SSH host key never became available" >&2
          exit 1

      - name: Authorize operator SSH key
        if: (needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update') && vars.DEV_OPERATOR_SSH_PUBLIC_KEY != ''
        env:
          DEV_DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_OPERATOR_SSH_PUBLIC_KEY: ${{ vars.DEV_OPERATOR_SSH_PUBLIC_KEY }}
        run: |
          case "$DEV_OPERATOR_SSH_PUBLIC_KEY" in
            "ssh-ed25519 "*" zoomigo-operator") ;;
            *) echo "DEV_OPERATOR_SSH_PUBLIC_KEY is not a sanitized Ed25519 key" >&2; exit 1 ;;
          esac
          key_file="$RUNNER_TEMP/dev-deploy-key"
          (umask 077 && printf '%s\n' "$DEV_DEPLOY_SSH_KEY_VALUE" >"$key_file")
          chmod 0600 "$key_file" "$RUNNER_TEMP/dev-known-hosts"
          host=$(cat "$RUNNER_TEMP/dev-host")
          printf '%s\n' "$DEV_OPERATOR_SSH_PUBLIC_KEY" | ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/dev-known-hosts" \
            "zoomigo@$host" 'set -eu
              IFS= read -r operator_key
              case "$operator_key" in
                "ssh-ed25519 "*" zoomigo-operator") ;;
                *) exit 2 ;;
              esac
              umask 077
              install -d -m 0700 "$HOME/.ssh"
              authorized_keys="$HOME/.ssh/authorized_keys"
              candidate=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
              trap '\''rm -f -- "$candidate"'\'' EXIT
              if [ -f "$authorized_keys" ]; then
                sed '\''/ zoomigo-operator$/d'\'' "$authorized_keys" >"$candidate"
              fi
              printf '\''%s\n'\'' "$operator_key" >>"$candidate"
              chmod 0600 "$candidate"
              mv -f -- "$candidate" "$authorized_keys"
              trap - EXIT'

      - name: Publish dev operator access endpoint
        if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
        run: |
          access_directory="$RUNNER_TEMP/dev-operator-access"
          install -d -m 0700 "$access_directory"
          install -m 0600 "$RUNNER_TEMP/dev-host" "$access_directory/host"
          install -m 0600 "$RUNNER_TEMP/dev-known-hosts" "$access_directory/known_hosts"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
        with:
          name: dev-operator-access-${{ github.run_id }}
          path: ${{ runner.temp }}/dev-operator-access
          retention-days: 1
          if-no-files-found: error

      - name: Deploy VM and password-gated Worker
        if: needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update'
        env:
          DEPLOY_HOST_FILE: ${{ runner.temp }}/dev-host
          DEPLOY_USER: zoomigo
          DEV_DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
          DEV_FIXTURE_SEED: ${{ secrets.DEV_FIXTURE_SEED }}
          DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          DEV_ACCESS_SESSION_KEY: ${{ secrets.DEV_ACCESS_SESSION_KEY }}
          STAFF_SECRET_KEY: ${{ secrets.DEV_STAFF_SECRET_KEY }}
          DEV_API_IMAGE: ${{ env.API_IMAGE_OVERRIDE }}
          DEV_RELAY_IMAGE: ${{ env.DEV_RELAY_IMAGE }}
          ZOOMIGO_API_BASE_URL: https://api-dev.zoomigo.quicktrack.cc
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENABLE_OBSERVABILITY: ${{ vars.DEV_OBSERVABILITY_ENABLED }}
          GRAFANA_LOGS_URL: ${{ vars.GRAFANA_DEV_LOGS_URL }}
          GRAFANA_LOGS_USERNAME: ${{ vars.GRAFANA_DEV_LOGS_USERNAME }}
          GRAFANA_LOGS_TOKEN: ${{ secrets.GRAFANA_DEV_LOGS_TOKEN }}
          GRAFANA_METRICS_URL: ${{ vars.GRAFANA_DEV_METRICS_URL }}
          GRAFANA_METRICS_USERNAME: ${{ vars.GRAFANA_DEV_METRICS_USERNAME }}
          GRAFANA_METRICS_TOKEN: ${{ secrets.GRAFANA_DEV_METRICS_TOKEN }}
        run: |
          key_file="$RUNNER_TEMP/dev-deploy-key"
          (umask 077 && printf '%s\n' "$DEV_DEPLOY_SSH_KEY_VALUE" >"$key_file")
          chmod 0600 "$key_file" "$RUNNER_TEMP/dev-known-hosts"
          DEPLOY_HOST="$(cat "$DEPLOY_HOST_FILE")"
          export DEPLOY_HOST
          export DEV_DEPLOY_SSH_KEY_FILE="$key_file"
          export DEV_KNOWN_HOSTS_FILE="$RUNNER_TEMP/dev-known-hosts"
          ./deploy/release/deploy-dev.sh \
            "${{ github.sha }}" \
            "${{ needs.build.outputs.revision }}" \
            "$GITHUB_WORKSPACE/source"

      - name: Seed a newly created preview
        if: needs.context.outputs.operation == 'create' || steps.infra.outputs.created == 'true'
        env:
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
        run: |
          ./deploy/release/retry-command.sh 3 10 curl --fail --silent --show-error \
            -X POST \
            -H "X-Zoomigo-Dev-Gateway: $DEV_API_GATEWAY_TOKEN" \
            -H "X-Zoomigo-Dev-Reset: $DEV_RESET_KEY" \
            https://api-dev.zoomigo.quicktrack.cc/__dev/reset

      - name: Reset preview fixtures
        if: needs.context.outputs.operation == 'reset'
        env:
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
        run: |
          ./deploy/release/retry-command.sh 3 10 curl --fail --silent --show-error \
            -X POST \
            -H "X-Zoomigo-Dev-Gateway: $DEV_API_GATEWAY_TOKEN" \
            -H "X-Zoomigo-Dev-Reset: $DEV_RESET_KEY" \
            https://api-dev.zoomigo.quicktrack.cc/__dev/reset

      - name: Prove final disposable-dev flows
        if: needs.context.outputs.operation == 'create' || steps.infra.outputs.created == 'true'
        env:
          DEV_SMOKE_API_BASE_URL: https://api-dev.zoomigo.quicktrack.cc
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_SMOKE_EXPECTED_RELEASE: ${{ needs.build.outputs.revision }}
        run: node scripts/dev-deploy-smoke.mjs

      - name: Remove Worker
        if: needs.context.outputs.operation == 'destroy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler delete zoomigo-training-dev --force

      - name: Destroy disposable infrastructure
        if: needs.context.outputs.operation == 'destroy'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_release_sha: ${{ github.sha }}
          DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        working-directory: infra/dev
        run: |
          key_file="$RUNNER_TEMP/dev-deploy-key"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$key_file")
          TF_VAR_ssh_public_key="$(ssh-keygen -y -f "$key_file")"
          export TF_VAR_ssh_public_key
          tofu destroy -input=false -auto-approve

      - name: Summarize
        if: always()
        run: |
          {
            echo "### ZoomiGo disposable dev"
            echo ""
            echo "- Operation: \`${{ needs.context.outputs.operation }}\`"
            echo "- Trusted deployment revision: \`${{ github.sha }}\`"
            if [ -n "${{ needs.build.outputs.revision }}" ]; then
              echo "- Application revision: \`${{ needs.build.outputs.revision }}\`"
            fi
            if [ -f source/release-manifest.json ]; then
              echo '```json'
              cat source/release-manifest.json
              echo '```'
            fi
            if [ "${{ needs.context.outputs.operation }}" != "destroy" ]; then
              echo "- PWA: https://dev.zoomigo.quicktrack.cc"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove temporary deployment files
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/dev-deploy-key" "$RUNNER_TEMP/dev-host" "$RUNNER_TEMP/dev-known-hosts"
          rm -rf -- infra/dev/.terraform source "$RUNNER_TEMP/dev-operator-access"

  qualify:
    name: Qualify the live development release
    needs: [context, build, operate]
    if: >-
      always() && needs.context.result == 'success' &&
      (needs.context.outputs.operation == 'qualify' ||
      (needs.operate.result == 'success' && needs.build.result == 'success' &&
      (needs.context.outputs.operation == 'create' || needs.context.outputs.operation == 'update')))
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: Prove the exact dev container is serving
        env:
          DEV_SMOKE_API_BASE_URL: https://api-dev.zoomigo.quicktrack.cc
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_SMOKE_EXPECTED_RELEASE: ${{ needs.build.outputs.revision || needs.context.outputs.ref }}
        run: node scripts/dev-deploy-smoke.mjs --read-only

      - name: Install the deployed-dev release browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove a qualified player's visible Lounge avatar
        env:
          DEV_LOUNGE_RELEASE_GATE: "true"
          DEV_SMOKE_API_BASE_URL: https://api-dev.zoomigo.quicktrack.cc
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          E2E_PWA_BASE_URL: https://dev.zoomigo.quicktrack.cc
        run: pnpm exec playwright test e2e/dev-lounge-release-gate.spec.ts

      - name: Prove Team World through the shared dev gate
        env:
          DEV_WORLD_RELEASE_GATE: "true"
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          E2E_PWA_BASE_URL: https://dev.zoomigo.quicktrack.cc
        run: pnpm exec playwright test e2e/dev-team-world.spec.ts

      - name: Record the qualification receipt
        if: always()
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.revision || needs.context.outputs.ref }}
        run: |
          {
            echo "### Live development qualification"
            echo "- Expected application: $EXPECTED_SHA"
            echo "- Trusted controller: $GITHUB_SHA"
            echo "- Qualification: ${{ job.status }}"
            echo "Deployment and fixture reset are never performed by this job."
          } >>"$GITHUB_STEP_SUMMARY"
