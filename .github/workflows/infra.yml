name: ZoomiGo infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: OpenTofu action to run
        required: true
        type: choice
        options:
          - plan
          - apply
      plan_run_id:
        description: Run ID of the "plan" run to apply (required for apply)
        required: false
        type: string

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: inputs.action == 'plan'
    name: tofu plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.10

      - name: Read the production hostnames
        run: |
          {
            printf 'API_HOSTNAME=%s\n' "$(jq -r '.apiHostname' deploy/production.json)"
            printf 'PWA_HOSTNAME=%s\n' "$(jq -r '.pwaHostname' deploy/production.json)"
          } >>"$GITHUB_ENV"

      - name: Derive the deployment SSH public key
        env:
          ZOOMIGO_DEPLOY_SSH_KEY: ${{ secrets.ZOOMIGO_DEPLOY_SSH_KEY }}
        run: |
          umask 077
          identity="$RUNNER_TEMP/deploy_ssh_key"
          printf '%s\n' "$ZOOMIGO_DEPLOY_SSH_KEY" >"$identity"
          printf 'SSH_PUBLIC_KEY=%s\n' "$(ssh-keygen -y -P '' -f "$identity")" >>"$GITHUB_ENV"
          rm -f -- "$identity"

      - name: tofu init
        working-directory: infra/digitalocean
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/digitalocean/terraform.tfstate" \
            -backend-config="endpoint=${{ vars.TF_STATE_ENDPOINT }}" \
            -backend-config="region=auto" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}"

      - name: tofu plan
        working-directory: infra/digitalocean
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          tofu plan -input=false -out=tfplan \
            -var="release_sha=${{ github.sha }}" \
            -var="ssh_public_key=${SSH_PUBLIC_KEY}" \
            -var="api_hostname=${API_HOSTNAME}" \
            -var="pwa_hostname=${PWA_HOSTNAME}" \
            -var="cloudflare_zone_id=${{ vars.CLOUDFLARE_ZONE_ID }}" \
            -var='ssh_source_addresses=${{ vars.SSH_SOURCE_ADDRESSES }}' \
            -var='alert_email_addresses=${{ vars.ALERT_EMAIL_ADDRESSES }}' \
            -var="backup_age_recipient=${{ vars.BACKUP_AGE_RECIPIENT }}" \
            -var="operator_ssh_public_key=${{ vars.OPERATOR_SSH_PUBLIC_KEY }}"
          tofu show -no-color tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/digitalocean/tfplan
          retention-days: 14

      - name: Record the plan run ID and plan output
        working-directory: infra/digitalocean
        run: |
          {
            echo "### tofu plan"
            echo ""
            echo "To apply this exact plan, trigger this workflow again with"
            echo "\`action: apply\` and \`plan_run_id: ${{ github.run_id }}\`."
            echo ""
            echo '<details><summary>Plan output</summary>'
            echo ""
            echo '```'
            tofu show -no-color tfplan
            echo '```'
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

  apply:
    if: inputs.action == 'apply'
    name: tofu apply
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      # contents: write so the pinned host key can be committed back; a Droplet
      # replacement changes the host key and releases fail until it is pinned.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.10

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/digitalocean
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: tofu init
        working-directory: infra/digitalocean
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/digitalocean/terraform.tfstate" \
            -backend-config="endpoint=${{ vars.TF_STATE_ENDPOINT }}" \
            -backend-config="region=auto" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}"

      - name: tofu apply
        working-directory: infra/digitalocean
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tofu apply -input=false tfplan

      # Replacing the Droplet changes its SSH host key, and deploy-vm.sh runs
      # with StrictHostKeyChecking=yes against infra/known_hosts, so a release
      # cannot connect until the new key is pinned. Scanning here -- from the
      # same job that just created the Droplet, seconds after its first boot --
      # anchors that trust to the DigitalOcean API, which this workflow already
      # trusts completely to choose the address and provision the image. It
      # replaces a manual fingerprint copy out of the DigitalOcean console,
      # which was never a stronger check against DigitalOcean itself.
      - name: Pin the Droplet host key
        working-directory: infra/digitalocean
        run: |
          host=$(tofu output -raw deploy_host)
          printf 'DEPLOY_HOST_ACTUAL=%s\n' "$host" >>"$GITHUB_ENV"
          scan="$RUNNER_TEMP/known_hosts"
          : >"$scan"
          for attempt in $(seq 1 30); do
            if ssh-keyscan -T 10 -t ed25519 "$host" 2>/dev/null | grep ' ssh-ed25519 ' >"$scan"; then
              break
            fi
            echo "sshd is not answering on $host yet (attempt $attempt/30); retrying in 10s..."
            sleep 10
          done
          found=$(grep -c ' ssh-ed25519 ' "$scan" || true)
          if [ "$found" != "1" ]; then
            echo "::error::expected exactly one ED25519 host key from $host, got ${found:-0}"
            exit 1
          fi
          install -m 0644 "$scan" "$GITHUB_WORKSPACE/infra/known_hosts"
          ssh-keygen -E sha256 -lf "$GITHUB_WORKSPACE/infra/known_hosts"

      - name: Commit the pinned host key
        run: |
          if git diff --quiet -- infra/known_hosts; then
            echo "infra/known_hosts already matches the live host." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/known_hosts
          git commit -m "chore: pin Droplet host key for ${DEPLOY_HOST_ACTUAL}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "Pinned and committed the host key for ${DEPLOY_HOST_ACTUAL}." >>"$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN cannot write Environment variables (that needs repository
      # admin), so this reports drift rather than fixing it. The Reserved IP is
      # stable across Droplet rebuilds, so this only fires when the Reserved IP
      # itself was replaced.
      - name: Check DEPLOY_HOST is current
        env:
          DEPLOY_HOST_VAR: ${{ vars.DEPLOY_HOST }}
        run: |
          if [ "$DEPLOY_HOST_VAR" = "$DEPLOY_HOST_ACTUAL" ]; then
            echo "DEPLOY_HOST is current (${DEPLOY_HOST_ACTUAL})." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### DEPLOY_HOST is stale"
            echo ""
            echo "The Reserved IP is now \`${DEPLOY_HOST_ACTUAL}\` but \`vars.DEPLOY_HOST\` is \`${DEPLOY_HOST_VAR:-unset}\`."
            echo "Releases will target the old address until this is updated:"
            echo ""
            echo '```sh'
            echo "gh variable set DEPLOY_HOST --env production --body ${DEPLOY_HOST_ACTUAL} --repo ${{ github.repository }}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::error::vars.DEPLOY_HOST is stale; see the job summary for the fix"
          exit 1

      - name: Record what was applied
        run: |
          echo "Applied the plan from run ${{ inputs.plan_run_id }}." >>"$GITHUB_STEP_SUMMARY"
