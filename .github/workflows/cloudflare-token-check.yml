name: Check the Cloudflare API token scopes

# Diagnostic only. "wrangler deploy" fails with "Authentication error
# [code: 10000]" on /accounts/<id>/workers/services/zoomigo-training, which
# means CLOUDFLARE_API_TOKEN is valid but lacks Workers permissions -- the same
# token already works for DNS, which is why OpenTofu succeeds. This probes each
# capability the release needs and reports which ones are missing, so the token
# can be corrected in one pass instead of by trial and error.
#
# Prints HTTP status codes and Cloudflare error codes only, never the token.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Probe token capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Probe each capability the release needs
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          api=https://api.cloudflare.com/client/v4

          probe() {
            label=$1
            path=$2
            needed=$3
            body=$(curl -sS -o "$RUNNER_TEMP/body.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "${api}${path}" 2>/dev/null || echo "000")
            if [ "$body" = "200" ]; then
              verdict="OK"
            else
              verdict="FAIL"
            fi
            detail=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")' "$RUNNER_TEMP/body.json" 2>/dev/null)
            [ -n "$detail" ] || detail="-"
            printf '| %s | %s | %s | %s | %s |\n' \
              "$label" "$body" "$verdict" "$needed" "$detail" >>"$RUNNER_TEMP/rows.md"
            printf '%s: HTTP %s (%s) %s\n' "$label" "$body" "$verdict" "$detail"
          }

          : >"$RUNNER_TEMP/rows.md"
          probe "Token verify (user)" "/user/tokens/verify"                              "n/a for account-owned tokens"
          probe "Token verify (acct)" "/accounts/${CF_ACCOUNT}/tokens/verify"            "-"
          probe "Account ID resolves" "/accounts/${CF_ACCOUNT}"                          "Account / Account Settings / Read"
          probe "DNS read (control)"  "/zones/${CF_ZONE}/dns_records?per_page=1"          "Zone / DNS / Edit"
          probe "Workers scripts"     "/accounts/${CF_ACCOUNT}/workers/scripts"           "Account / Workers Scripts / Edit"
          probe "Worker service"      "/accounts/${CF_ACCOUNT}/workers/services/zoomigo-training" "Account / Workers Scripts / Edit"
          probe "Workers subdomain"   "/accounts/${CF_ACCOUNT}/workers/subdomain"         "Account / Workers Scripts / Edit"
          probe "Workers routes"      "/zones/${CF_ZONE}/workers/routes"                  "Zone / Workers Routes / Edit"

          {
            echo "### Cloudflare token capability probe"
            echo ""
            echo "| Capability | HTTP | Verdict | Scope required | Cloudflare error |"
            echo "|---|---|---|---|---|"
            cat "$RUNNER_TEMP/rows.md"
            echo ""
            echo "The release needs every row above to read OK. \`wrangler deploy\` publishes"
            echo "the Worker (Workers Scripts) and attaches the custom domain"
            echo "\`zoomigo.quicktrack.cc\` (Workers Routes + DNS)."
          } >>"$GITHUB_STEP_SUMMARY"
