name: Install DigitalOcean droplet agent

# One-off maintenance workflow: the digitalocean_droplet.zoomigo resource now
# sets droplet_agent = true (see infra/digitalocean/main.tf), but that
# attribute is ForceNew and is intentionally ignored post-creation to avoid
# force-replacing a prevent_destroy-protected Droplet (see the lifecycle
# block). Droplets created before this change need the agent installed by
# hand once; this workflow does that over SSH using the deploy key already
# stored in GitHub, since the operator does not keep a local copy of it.
#
# This connects over SSH before the host has been through the normal
# fingerprint-verified adopt-host.mjs flow, so it deliberately uses
# StrictHostKeyChecking=accept-new instead of a verified known_hosts entry.
# That is acceptable here only because this workflow does no more than run
# DigitalOcean's own official agent installer, and does not touch
# infra/known_hosts or the DEPLOY_HOST variable used by real releases.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install-agent:
    name: Install droplet-agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.10

      - name: tofu init
        working-directory: infra/digitalocean
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/digitalocean/terraform.tfstate" \
            -backend-config="endpoint=${{ vars.TF_STATE_ENDPOINT }}" \
            -backend-config="region=auto" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}"

      - name: Read the Droplet's reserved IP and ID from state
        working-directory: infra/digitalocean
        run: |
          {
            echo "DEPLOY_HOST=$(tofu output -raw deploy_host)"
            echo "DROPLET_ID=$(tofu output -raw droplet_id)"
          } >>"$GITHUB_ENV"

      - name: Check Droplet and firewall status via the DigitalOcean API
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          echo "--- droplet ---"
          curl -sS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            "https://api.digitalocean.com/v2/droplets/$DROPLET_ID" \
            | jq '{status: .droplet.status, created_at: .droplet.created_at, networks: .droplet.networks}'
          echo "--- firewall ---"
          curl -sS -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            "https://api.digitalocean.com/v2/firewalls?per_page=200" \
            | jq '.firewalls[] | select(.droplet_ids[]? == '"$DROPLET_ID"') | {status: .status, inbound_rules: .inbound_rules}'

      - name: Install the droplet agent over SSH
        env:
          ZOOMIGO_DEPLOY_SSH_KEY: ${{ secrets.ZOOMIGO_DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          umask 077
          identity="$RUNNER_TEMP/deploy_ssh_key"
          printf '%s\n' "$ZOOMIGO_DEPLOY_SSH_KEY" >"$identity"
          chmod 600 "$identity"
          ssh_target="${DEPLOY_USER:-zoomigo}@${DEPLOY_HOST}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if ssh -i "$identity" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              "$ssh_target" \
              'wget -qO- https://repos-droplet.digitalocean.com/install.sh | sudo bash && sudo systemctl status --no-pager droplet-agent'
            then
              rm -f -- "$identity"
              exit 0
            fi
            echo "SSH attempt $attempt failed; retrying in 20s (a just-created Droplet, or one mid-reboot from unattended-upgrades, can briefly refuse connections)..."
            sleep 20
          done
          rm -f -- "$identity"
          echo "::error::Could not SSH to $DEPLOY_HOST after 8 attempts"
          exit 1
