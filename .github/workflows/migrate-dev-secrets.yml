name: Migrate provider credentials to dev (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Seal only provider credentials directly to GitHub's dev public key
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_STATE_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          TF_STATE_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          DEV_ACCESS_PASSWORD: ${{ secrets.DEV_ACCESS_PASSWORD }}
          DEV_ACCESS_SESSION_KEY: ${{ secrets.DEV_ACCESS_SESSION_KEY }}
          DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
          DEV_API_GATEWAY_TOKEN: ${{ secrets.DEV_API_GATEWAY_TOKEN }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_FIXTURE_SEED: ${{ secrets.DEV_FIXTURE_SEED }}
          DEV_RESET_KEY: ${{ secrets.DEV_RESET_KEY }}
          DEV_STAFF_SECRET_KEY: ${{ secrets.DEV_STAFF_SECRET_KEY }}
        run: |
          python3 - <<'PYTHON'
          import base64, ctypes, json, os
          from pathlib import Path
          if os.environ['GITHUB_REPOSITORY'] != 'dafepro/fc-workout-pwa':
              raise RuntimeError('Invalid migration repository')
          sodium = ctypes.CDLL('/opt/homebrew/lib/libsodium.dylib')
          if sodium.sodium_init() < 0:
              raise RuntimeError('Encryption initialization failed')
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          key = base64.b64decode('WVlsyd6zglwUCkl4jUwwmIfVQODtalZpLYpN6hYv00U=', validate=True)
          if len(key) != 32:
              raise RuntimeError('Invalid destination public key')
          names = ('DIGITALOCEAN_TOKEN', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'TF_STATE_ACCESS_KEY_ID', 'TF_STATE_SECRET_ACCESS_KEY', 'DEV_ACCESS_PASSWORD', 'DEV_ACCESS_SESSION_KEY', 'DEV_ADMIN_PASSWORD', 'DEV_API_GATEWAY_TOKEN', 'DEV_DEPLOY_SSH_KEY', 'DEV_FIXTURE_SEED', 'DEV_RESET_KEY', 'DEV_STAFF_SECRET_KEY')
          sealed = []
          for name in names:
              value = os.environ.pop(name, '').encode()
              if not value:
                  raise RuntimeError('Required migration source is unavailable')
              ciphertext = ctypes.create_string_buffer(len(value) + 48)
              if sodium.crypto_box_seal(ciphertext, value, len(value), key) != 0:
                  raise RuntimeError('Credential sealing failed')
              sealed.append({'name': name, 'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(ciphertext.raw).decode()})
              del value
          target = Path(os.environ['RUNNER_TEMP']) / 'dev-sealed-secrets.json'
          target.write_text(json.dumps({'repository': 'dafepro/fc-workout-pwa', 'environment': 'dev', 'secrets': sealed}))
          target.chmod(0o600)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: dev-sealed-secrets
          path: ${{ runner.temp }}/dev-sealed-secrets.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove sealed transfer file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/dev-sealed-secrets.json"
