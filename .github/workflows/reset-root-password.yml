name: Reset Droplet root password

# One-off maintenance workflow. SSH to the Droplet is refusing connections
# outright (an immediate RST, not a timeout) even though the firewall and
# network attachment are both confirmed healthy -- that almost always means
# sshd itself isn't running. Diagnosing that needs a shell, but the normal
# web Droplet Console needs droplet-agent (the very thing that's stuck), and
# root's password was never set (cloud-init disables/locks it). DigitalOcean's
# separate Recovery Console works without droplet-agent, network, or sshd,
# but does need a working password -- this triggers DigitalOcean's own
# "Reset Root Password" action, which emails a new one to the account owner
# and reboots the Droplet to apply it.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reset-password:
    name: Trigger password reset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.10

      - name: tofu init
        working-directory: infra/digitalocean
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/digitalocean/terraform.tfstate" \
            -backend-config="endpoint=${{ vars.TF_STATE_ENDPOINT }}" \
            -backend-config="region=auto" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}"

      - name: Read the Droplet ID from state
        working-directory: infra/digitalocean
        run: echo "DROPLET_ID=$(tofu output -raw droplet_id)" >>"$GITHUB_ENV"

      - name: Trigger the password_reset action
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"password_reset"}' \
            "https://api.digitalocean.com/v2/droplets/$DROPLET_ID/actions")
          body=$(printf '%s' "$response" | head -n -1)
          code=$(printf '%s' "$response" | tail -n1)
          echo "$body" | jq .
          [ "$code" = "201" ] || { echo "::error::password_reset action request failed (HTTP $code)"; exit 1; }
          echo "Password reset triggered and Droplet will reboot. A new root password will be emailed to the DigitalOcean account owner."
