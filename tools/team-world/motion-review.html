<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar motion review</title>
    <style>
      body {
        background: #bbcbbb;
        font: 16px system-ui;
      }
      output {
        display: block;
        max-height: 3em;
        overflow: auto;
        font: 11px monospace;
        margin: 12px 0;
      }
      canvas {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <button id="run">Run sprint comparison</button
    ><button id="kick">Review kick</button
    ><button id="play">Play / pause kick</button
    ><label><input id="slow" type="checkbox" checked />Slow motion</label
    ><label
      >View
      <select id="angle">
        <option value="35">Front three-quarter</option>
        <option value="0">Front</option>
        <option value="90">Right side</option>
        <option value="145">Rear three-quarter</option>
      </select></label
    ><output id="result">Loading</output>
    <div id="view"></div>
    <script type="module" src="./motion-review.ts"></script>
  </body>
</html>
